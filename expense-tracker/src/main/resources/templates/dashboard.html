<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Expense Tracker</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0D1527 0%, #070B14 100%);
            color: white; display: flex; justify-content: center; min-height: 100vh;
        }
        .container { width: 350px; padding: 20px; }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; border-radius: 25px; margin-bottom: 20px; text-align: center;
        }
        h2 { color: #00f2fe; margin-top: 0; }
        .transaction-list { margin-top: 20px; text-align: left; }
        .item {
            background: rgba(255, 255, 255, 0.05); padding: 12px;
            border-radius: 12px; margin-bottom: 8px; font-size: 14px;
            display: flex; justify-content: space-between;
        }
        /* Buttons Style */
        .btn {
            display: block; width: 100%; padding: 12px; margin-top: 10px;
            text-decoration: none; border-radius: 12px; text-align: center; font-weight: bold;
        }
        .btn-add { background: #00f2fe; color: #0D1527; }
        .btn-logout { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2>Expense Dashboard</h2>
        <p>Recent Transactions</p>

        <div class="transaction-list">
            <div th:if="${#lists.isEmpty(transactions)}" style="text-align: center; opacity: 0.6;">
                No transactions yet.
            </div>

            <div th:each="t : ${transactions}" class="item">
                <span th:text="${t.description}">Lunch</span>
                <b th:text="'₹' + ${t.amount}">500</b>
            </div>
        </div>
    </div>

    <a href="/add-transaction" class="btn btn-add">+ Add New Transaction</a>
    <a href="/" class="btn btn-logout">Logout</a>
</div>

</body>
</html>
