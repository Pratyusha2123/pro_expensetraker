<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0D1527 0%, #070B14 50%, #13223F 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 40px;
            width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h2 { color: #ffffff; margin-bottom: 8px; font-size: 28px; font-weight: 600; }
        p { color: rgba(255, 255, 255, 0.5); font-size: 14px; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(67, 100, 247, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(67, 100, 247, 0.6);
        }

        .signup-link { margin-top: 25px; font-size: 14px; color: rgba(255, 255, 255, 0.6); }
        .signup-link a { color: #00f2fe; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Welcome Back</h2>
    <p>Sign in to monitor your expenses</p>

    <form action="/dashboard" method="get">
        <div class="input-group">
            <input type="text" name="username" placeholder="Username or Email" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="signup-link">
        Don't have an account? <a href="/signup">Create one</a>
    </div>
</div>

</body>
</html>
