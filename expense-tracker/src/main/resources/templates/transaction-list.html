<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Expense Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0D1527 0%, #070B14 50%, #13223F 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 20px 80px 20px;
            box-sizing: border-box;
            flex: 1;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .pdf-btn-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-pdf {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pdf:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00f2fe;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.2);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .history-item:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .item-category {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .item-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .item-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
        }

        .item-amount {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Fixed structural references to eliminate warnings */
        .history-list .amount-income {
            color: #2ed573;
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.3);
        }

        .history-list .amount-expense {
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
        }

        .no-data {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 50px;
            font-size: 15px;
        }

        .navbar {
            background: rgba(7, 11, 20, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item.active {
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>All Transactions</h2>

    <div class="pdf-btn-container">
        <button class="btn-pdf" onclick="window.location.href='/api/transactions/download/pdf'">
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
            </svg>
            Download PDF Report
        </button>
    </div>

    <div class="history-list" id="historyContainer">
        <div class="no-data">Loading account records...</div>
    </div>
</div>

<div class="navbar">
    <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
    </a>
    <a class="nav-item" href="add-transaction.html">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add Tx
    </a>
    <a class="nav-item active" href="transaction-list.html">
        <svg viewBox="0 0 24 24"><path d="M4 14h4v-4H4v4zm0 5h4v-4H4v4zM4 9h4V5H4v4zm5 5h12v-4H9v4zm0 5h12v-4H9v4zM9 5v4h12V5H9z"/></svg>
        History
    </a>
</div>

<script>
    const API_URL = "/api/transactions";

    async function fetchHistory() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            const container = document.getElementById("historyContainer");
            container.innerHTML = "";

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="no-data">No transactions logged yet.</div>';
                return;
            }

            data.reverse().forEach(item => {
                const isIncome = item.type === "Income";
                const amountSign = isIncome ? "+" : "-";
                const amountClass = isIncome ? "amount-income" : "amount-expense";

                container.innerHTML += `
                    <div class="history-item">
                        <div class="item-details">
                            <div class="item-category">${item.category}</div>
                            <div class="item-desc">${item.description || "No description"}</div>
                            <div class="item-date">${item.transactionDate || "N/A"}</div>
                        </div>
                        <div class="item-amount ${amountClass}">
                            ${amountSign}₹${parseFloat(item.amount).toFixed(2)}
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error("Backend Error:", error);
            document.getElementById("historyContainer").innerHTML =
                '<div class="no-data" style="color:#ff4757">Failed to reload system logs!</div>';
        }
    }
    fetchHistory();
</script>
</body>
</html>
