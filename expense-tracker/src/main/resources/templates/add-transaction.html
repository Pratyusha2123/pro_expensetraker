<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction - Expense Tracker</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0D1527 0%, #070B14 50%, #13223F 100%);
            color: white; min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 80px; }
        h2 { text-align: center; margin-top: 20px; color: #00f2fe; }
        .form-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
        }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: rgba(255, 255, 255, 0.5); margin-bottom: 8px; }
        input {
            width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
            color: white; box-sizing: border-box; outline: none;
        }
        .btn-submit {
            width: 100%; padding: 16px; background: #00f2fe; border: none;
            border-radius: 14px; color: #0D1527; font-weight: bold; cursor: pointer;
        }
        /* Navbar */
        .navbar {
            position: fixed; bottom: 0; width: 100%; display: flex;
            justify-content: space-around; padding: 15px 0;
            background: rgba(7, 11, 20, 0.9); border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-item { color: white; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Add New Transaction</h2>
    <div class="form-card">
        <form action="/dashboard" method="get">
            <div class="input-group">
                <label>Description</label>
                <input type="text" placeholder="Lunch, Salary, etc." required>
            </div>
            <div class="input-group">
                <label>Amount (₹)</label>
                <input type="number" placeholder="0.00" required>
            </div>
            <button type="submit" class="btn-submit">Save Entry</button>
        </form>
    </div>
</div>

<div class="navbar">
    <a class="nav-item" href="/dashboard">Dashboard</a>
    <a class="nav-item" style="color:#00f2fe;" href="/add-transaction">Add Tx</a>
    <a class="nav-item" href="/">Logout</a>
</div>

</body>
</html>
